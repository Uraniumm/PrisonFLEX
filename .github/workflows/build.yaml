name: Build
on:
  workflow_dispatch:
    inputs:
      flex_repo:
        description: 'Custom FLEX GitHub Repository URL'
        required: false
        default: 'https://github.com/FLEXTool/FLEX'
      flex_branch:
        description: 'Custom FLEX GitHub Repository Branch'
        required: false
        default: 'master'
      build_target:
        description: 'Build Target (Standalone dylibs: PrisonFLEX, libFLEX. dylibs and debs: all)'
        required: false
        type: choice
        default: 'all'
        options:
          - all
          - PrisonFLEX
          - libFLEX
      create_release:
        description: 'Create version tag and GitHub release'
        required: true
        type: boolean
        default: false
  push:
    tags:
      - '[0-9]*'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk -F': *' '$1 == "Version" {print $2; exit}' control | tr -d '\r')"
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not read Version from control file"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            echo "::error::Invalid version in control: '$VERSION'"
            exit 1
          fi
          TAG="${VERSION}"
          echo "Version: $VERSION"
          echo "Tag:     $TAG"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match control version $TAG"
            exit 1
          fi
      # DEBUG ONLY sanity check version output #
      # - name: Show release configuration
      #   run: |
      #   echo "Version:      ${{ steps.version.outputs.version }}"
      #   echo "Tag:          ${{ steps.version.outputs.tag }}"
      #   echo "Build target: ${{ github.event.inputs.build_target }}"
      #   echo "Release:      ${{ inputs.create_release }}"
      # DEBUG ONLY sanity check version output #
      - name: Install Theos
        uses: Randomblock1/theos-action@v1.4
        with:
          theos-dir: ${{ github.workspace }}/theos
          theos-src: https://github.com/theos/theos
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master
          orion: false
      - name: Run build script
        run: |
          chmod +x ./build.sh
          ./build.sh \
            '${{ github.event.inputs.flex_repo }}' \
            '${{ github.event.inputs.flex_branch }}' \
            '${{ github.event.inputs.build_target }}'
      - name: Create version tag
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Did you forget to bump Version in control?"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Release $VERSION"
          git push origin "$TAG"
      - name: Create GitHub Release
        if: |
          (github.event_name == 'workflow_dispatch' && inputs.create_release) ||
          github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo '${{ github.repository }}' \
            --verify-tag \
            --notes "" \
            --title "v${TAG}-Release"
      - name: Upload artifacts to GitHub Release
        if: |
          (github.event_name == 'workflow_dispatch' && inputs.create_release) ||
          github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            packages/* \
            --repo '${{ github.repository }}'
